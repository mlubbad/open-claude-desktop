# Open Claude Desktop — local dev stack: Postgres + FastAPI backend.
#   docker compose up -d --build
#
# On first start (empty volume) backend/db_init/01_create_ocd.sql creates the
# `ocd` role + database that the default DATABASE_URL expects; Alembic then runs
# `upgrade head` on backend startup. The React/Tauri client (Phase 3) ships
# separately; run the transitional Reflex frontend locally (see README).
#
# Only the temporary containment proxy is published on HOST loopback. The backend
# remains private to the Compose network. Because it binds 0.0.0.0 inside the
# container, APP_USERNAME / APP_PASSWORD / APP_AUTH_SECRET are mandatory in .env;
# OCD_ALLOW_INSECURE_NETWORK is only a launch-freeze development classification and
# no longer bypasses authentication.

services:
  postgres:
    image: postgres:16
    container_name: ocd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ocd_pgdata:/var/lib/postgresql/data
      - ./backend/db_init/01_create_ocd.sql:/docker-entrypoint-initdb.d/01_create_ocd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: ocd-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # This stack is a loopback-published DEVELOPMENT environment, never a hosted
      # deployment. The launch guard requires this explicit classification because the
      # backend binds 0.0.0.0 inside its container.
      OCD_DEPLOYMENT_MODE: "development"
      # Reach Postgres over the compose network (psycopg driver, `ocd` role/db).
      DATABASE_URL: postgresql+psycopg://ocd:ocd@postgres:5432/ocd
      OCD_DB_FALLBACK: "0"
      OCD_MAX_REQUEST_BYTES: "33554432"
      OCD_MAX_CONCURRENT_REQUESTS: "32"
      OCD_MAX_UPLOAD_BYTES: "26214400"
      # Dev-only launch-freeze carveout; authentication is still mandatory.
      OCD_ALLOW_INSECURE_NETWORK: "1"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    # BigQuery (optional connector) uses Application Default Credentials. Provide
    # them via Workload Identity, or mount a key and set
    # GOOGLE_APPLICATION_CREDENTIALS, e.g.:
    #   volumes:
    #     - /path/to/sa-key.json:/creds.json:ro
    #   environment:
    #     GOOGLE_APPLICATION_CREDENTIALS: /creds.json

  proxy:
    image: nginx:1.27-alpine
    container_name: ocd-containment-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/nginx/containment.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  ocd_pgdata:
