[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-claude-desktop"
version = "0.2.0"
description = "GLM-powered, Claude-Desktop-style agent (Chainlit + Reflex) over BigQuery."
readme = "README.md"
requires-python = ">=3.12"

# Human-readable source of truth for DIRECT dependencies. Exact, reproducible
# pins (incl. transitives) live in requirements.txt (a full pip freeze).
dependencies = [
    # zhipuai MUST resolve to the v2 SDK (the `ZhipuAI` class app.py imports).
    # Do NOT pin a range here: zhipuai 2.x needs pyjwt<2.9 while mcp needs
    # pyjwt>=2.10.1, so any honest pin makes the resolve fail — and unpinned,
    # pip backtracks zhipuai to the broken v1.0.7. After installing, force the
    # known-good pair from requirements.txt, exactly as CI does:
    #   pip install --no-deps zhipuai==2.1.5.20250825 PyJWT==2.8.0
    # (Full story in the backend/pyproject.toml dependency note.)
    "zhipuai",
    "google-cloud-bigquery",
    "google-auth",
    "google-auth-oauthlib",
    "chromadb",
    "pandas",
    "mcp",
    "python-dotenv",
]

[project.optional-dependencies]
# Chainlit chat app (app.py): UI + charts + file parsing + Postgres data layer.
chainlit = ["chainlit", "matplotlib", "pdfplumber", "pdfminer.six", "pillow", "openpyxl", "asyncpg", "nest-asyncio"]
# Reflex projects UI (aj360_app/).
reflex = ["reflex"]
# Optional Arabic chart-label shaping.
arabic = ["arabic-reshaper", "python-bidi"]
# Tooling.
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
py-modules = ["app", "run"]
# ocd_core now lives in its own installable package under backend/ (see backend/pyproject.toml).
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# app.py imports ocd_core.* from the backend package, which this root project
# does not install — expose backend/ on sys.path for collection.
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "venv312", ".web", "frontend/.web", "node_modules", "reflex.lock"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",  # long lines tolerated in generated SQL / inline HTML strings
  "B008",  # FastAPI Depends() pattern: function call in default arg is intentional
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["venv/", "venv312/", "\\.web/", "node_modules/"]
