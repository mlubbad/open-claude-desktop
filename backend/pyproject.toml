[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocd-backend"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "zhipuai",
  "google-cloud-bigquery",
  "google-auth",
  "chromadb",
  "pandas",
  "pdfplumber",
  "mcp",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools]
# Flat package: all ocd_core/*.py modules (config, integrations, agent, …) ship
# under this one entry. A future cleanup may split integrations into a subpackage.
packages = ["ocd_core"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
