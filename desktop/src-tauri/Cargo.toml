[package]
name = "open-claude-desktop"
version = "0.1.0"
description = "Open Claude Desktop — model-agnostic desktop assistant"
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_claude_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
