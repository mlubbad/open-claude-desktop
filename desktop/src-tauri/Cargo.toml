[package]
name = "open-claude-desktop"
version = "0.1.0"
description = "VersoWork — model-agnostic native desktop workspace"
edition = "2021"
rust-version = "1.77"

[lib]
name = "open_claude_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-launch loopback API token (see spawn_backend / setup in lib.rs).
uuid = { version = "1", features = ["v4"] }
# Desktop-shell plugins. The Rust wiring is intentionally the minimal, high-confidence
# Desktop-shell plugins. The global-shortcut and notification surfaces are also driven
# from the frontend (platform.ts) via the plugins' JS APIs; shell hosts the backend
# sidecar spawned in lib.rs; updater powers the signed auto-update feed.
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
