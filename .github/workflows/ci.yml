name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend (+ dev)
        run: pip install -e ./backend[dev]
      - name: Run backend tests
        # Run from the repo root so both `app.main` and `backend.app.main` test
        # import styles resolve.
        run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frontend deps
        run: pip install -r frontend/requirements.txt respx pytest pytest-asyncio
      - name: Run frontend tests
        working-directory: frontend
        run: pytest

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install client deps
        working-directory: desktop
        run: npm ci
      - name: Typecheck + test + build
        working-directory: desktop
        run: |
          npm run typecheck
          npm run test
          npm run build

  lint:
    runs-on: ubuntu-latest
    # Blocking: the repo is ruff-clean (lint debt burned down 2026-07-03).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --output-format=github

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
