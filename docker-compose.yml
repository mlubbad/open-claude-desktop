# Local Postgres for Chainlit chat history.
#   docker compose up -d
# On FIRST start (empty volume), schema.sql is loaded automatically. If you change
# schema.sql later, re-run it manually or recreate the volume:
#   docker compose down -v && docker compose up -d
#
# Set POSTGRES_PASSWORD in your .env and make DATABASE_URL match it, e.g.:
#   DATABASE_URL=postgresql+asyncpg://chainlit:changeme@localhost:5432/chainlit

services:
  postgres:
    image: postgres:16
    container_name: aj360-chainlit-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: chainlit
    ports:
      - "5432:5432"
    volumes:
      - aj360_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db_init/01_create_ocd.sql:/docker-entrypoint-initdb.d/02_create_ocd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chainlit chat app. Build + run:  docker compose up -d --build
  app:
    build: .
    container_name: ocd-chainlit
    restart: unless-stopped
    env_file: .env
    # Reach Postgres over the compose network (overrides .env's localhost).
    environment:
      DATABASE_URL: postgresql+asyncpg://chainlit:${POSTGRES_PASSWORD:-changeme}@postgres:5432/chainlit
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # BigQuery uses Application Default Credentials. Provide them via Workload
    # Identity, or mount a key and set GOOGLE_APPLICATION_CREDENTIALS, e.g.:
    #   volumes:
    #     - /path/to/sa-key.json:/creds.json:ro
    #   environment:
    #     GOOGLE_APPLICATION_CREDENTIALS: /creds.json

volumes:
  aj360_pgdata:
