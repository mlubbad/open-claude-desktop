[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocd-backend"
version = "0.3.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  # Phase 1: a single OpenAI-compatible client drives every provider (OpenAI,
  # Zhipu/GLM, DeepSeek, Qwen, OpenRouter, Ollama, vLLM, …). This replaces the
  # hard-coded zhipuai SDK and removes its pyjwt<2.9 conflict with mcp.
  "openai",
  "google-cloud-bigquery",
  "google-auth",
  "chromadb",
  "pandas",
  "pdfplumber",
  "mcp",
  "python-dotenv",
  "sqlmodel",
  "alembic",
  "psycopg[binary]",
  "fastapi",
  "uvicorn",
  "sse-starlette",
  "httpx",
  "python-multipart",
  # C3: secrets go to the OS keychain (keyring) with an encrypted-file fallback
  # (cryptography/Fernet) for headless installs. Never plaintext in tracked files.
  "keyring",
  "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "respx"]

[tool.setuptools]
# Flat package: all ocd_core/*.py modules (config, integrations, agent, …) ship
# under this one entry. A future cleanup may split integrations into a subpackage.
packages = ["ocd_core", "ocd_core.db", "ocd_core.llm", "app", "app.routes"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
