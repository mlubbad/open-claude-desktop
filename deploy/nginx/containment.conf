# Temporary Days 1-3 containment edge. This is not production-launch approval:
# replace process/IP limits with the managed gateway, identity, WAF, and distributed
# rate-limit design before lifting the hosted/public launch freeze.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_conn_zone $binary_remote_addr zone=ocd_conn:10m;
    limit_req_zone $binary_remote_addr zone=ocd_rate:10m rate=20r/s;
    limit_conn_status 503;
    limit_req_status 429;

    upstream ocd_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 32m;
        client_body_timeout 30s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 60s;

        location = /healthz {
            proxy_pass http://ocd_backend;
        }

        location = /readyz {
            proxy_pass http://ocd_backend;
        }

        location / {
            limit_conn ocd_conn 32;
            limit_req zone=ocd_rate burst=40 nodelay;

            # Buffer request bodies at the edge so the backend never accumulates an
            # unbounded client upload. Response buffering stays off for SSE streaming.
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_pass http://ocd_backend;
        }
    }
}
